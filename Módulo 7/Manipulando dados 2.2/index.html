<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatoFeed - Rede Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo-fixo">
        <div class="box-postagem">
            <h2>Compartilhe algo com um gatinho</h2>
            <textarea id="texto-postagem" placeholder="O que está acontecendo?" rows="3"></textarea>
            <div class="acoes">
                <button id="btn-postar">Postar</button>
            </div>
        </div>
    </header>

    <main class="feed-container">
        <div id="feed"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
