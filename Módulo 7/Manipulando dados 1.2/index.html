<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Usuários GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Buscar Usuários no GitHub</h2>
        
        <div class="busca-box">
            <input type="text" id="input-busca" placeholder="Digite o nome do usuário...">
            <button id="btn-buscar">Buscar</button>
        </div>

        <!-- Local onde a lista ou a mensagem de erro será exibida -->
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
